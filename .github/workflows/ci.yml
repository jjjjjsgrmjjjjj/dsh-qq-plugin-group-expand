# What has to hold before a change is considered good.
#
# There is no build step here: the plugin is plain JavaScript, shipped as written. That removes
# most of what a CI file normally does, and it leaves the two things that have actually broken
# releases in this project:
#
#   1. A file that does not parse. `lib/runtime.js` is over 2000 lines and is edited by hand; a
#      stray brace there is a syntax error at import time, which in DSH means the plugin does not
#      activate. One `node --check` per file catches that in a second, and printing the filename
#      matters — a single globbed call would stop at the first bad file without saying which one.
#   2. A name that is used but never imported. That one is invisible to `node --check` (a free
#      variable is perfectly legal syntax) and to the unit checks (the path that reaches it may
#      need a real inbound message). It cost this project every attachment-bearing message once:
#      `ReferenceError: WORKSPACE_DIR_NAME is not defined`, logged as a single line while the user
#      saw three unrelated symptoms. `tools/check-unbound.mjs` exists for it, and
#      `tools/check-unused-imports.mjs` for its mirror image — an import left behind after the code
#      that used it was removed.
#
# Each checker under `tools/` carries a reverse control: it must catch the failure it was written
# for, or it declares itself untrustworthy and exits non-zero. A checker that can only ever print
# "pass" is worse than none, because it makes people believe something was verified.
# `tools/check-doc-counts.mjs` follows the same rule: it builds a temporary tree with a deliberately
# wrong digit and insists that it fails, before it is allowed to report on the real tree.
#
#   `tools/check-cross-plugin.mjs` needs a real DSH profile — the `dsh.profile.bundles` list and
#   the plugins installed under that profile's `node_modules`. A CI runner has neither, so it stays
#   a local check (see docs/RELEASING.md and the checkers' own usage notes).
#
# `smoke/` is out for two different reasons. Its two probes (`step3-probe.mjs`, `step4-probe.mjs`)
# talk to Tencent's live service and need real bot credentials, which do not belong in a public
# repository's CI; its two surface checks (`step4-surface.mjs`, `check-sdk-surface.mjs`) are offline
# and need nothing, but they are one-off research probes that print observations rather than assert
# pass/fail, so they are not gates either.
#
# The last piece is a documentation gate. README.md, README.zh.md and docs/RELEASING.md each state
# how many checks the three suites above contain, and those numbers are typed by hand — which is why
# they had already drifted once, to the tune of 177 host checks. So each suite's output is tee'd to
# `$RUNNER_TEMP` as it runs, and `tools/check-doc-counts.mjs` reads the counts back out and compares
# them against the three documents. Reading the tee'd output rather than re-running the suites is
# deliberate: the gate costs one extra second instead of a second full run, and the numbers it
# checks describe exactly the run that gated.
#
# That same checker also cross-checks the Trusted Publisher block in `publish.yml` — the four fields
# a user copies by hand into npmjs.com — against `package.json` and the workflow itself. A typo there
# is otherwise visible only as a 403 at publish time.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # `cache: npm` keys on package-lock.json, which is committed here, so the dependency
          # download is skipped on every run after the first.
          cache: npm

      - run: npm ci

      - name: Syntax-check every source file
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          count=0
          # One `node --check` per file, so a failure names the file it came from. `set -e` makes
          # the first one stop the job, which is the point: the remaining files' output would only
          # bury the real error.
          for file in **/*.js **/*.mjs; do
            case "$file" in
              *node_modules*) continue ;;
            esac
            node --check "$file"
            count=$((count + 1))
          done
          echo "parsed $count .js/.mjs files"

      # Each of the three test steps also tees its output to `$RUNNER_TEMP`, because the
      # "documented counts" step further down reads that output instead of running the suites a
      # second time. `set -o pipefail` is what stops `tee` (which always succeeds) from swallowing
      # a failing test's exit code.
      - name: Host-side checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-qq-doc-counts"
          node scripts/verify.mjs 2>&1 | tee "$RUNNER_TEMP/dsh-qq-doc-counts/verify.mjs.out"

      # The send path is the one piece of logic whose failure is silent: a message that never goes
      # out looks exactly like a message that was never sent. It also carries the passive→proactive
      # fallback and the rate limiter, so a regression there is invisible until someone notices they
      # are not being answered.
      #
      # `verify.mjs` cannot cover it — it needs a bot. This test substitutes one through a module
      # resolution hook (`node:module`), so the real `#send` runs against a fake transport with no
      # network and no writes to `node_modules`. The `/protocol` subpath is deliberately not faked,
      # so `ReplyLimiter` and `chunkText` are the real implementations.
      - name: Send-path checks (fake transport, real plugin)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-qq-doc-counts"
          node scripts/verify-send-path.mjs 2>&1 | tee "$RUNNER_TEMP/dsh-qq-doc-counts/verify-send-path.mjs.out"

      # The client plugin registers UI into a scope every other plugin shares. These checks assert
      # the registration shape (slot id, disposer, stylesheet removal) — they are not a visual
      # check, and nothing here renders a page.
      - name: Client-side checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dsh-qq-doc-counts"
          node scripts/verify-client.mjs 2>&1 | tee "$RUNNER_TEMP/dsh-qq-doc-counts/verify-client.mjs.out"

      # The counts written in README.md, README.zh.md and docs/RELEASING.md describe the output of
      # the three steps above, and they are typed by hand — which is exactly how they drifted 177
      # checks behind. This step reads the numbers out of the tee'd output and compares them against
      # all three documents, naming the file, the number written and the number measured. It does
      # not re-run anything: the numbers come from the same run that gated the change.
      #
      # The same checker then compares publish.yml's Trusted Publisher block with package.json and
      # with that workflow's own filename and `name:`, so a typo in the four fields is caught here
      # instead of surfacing as a 403 during a release.
      - name: The documented counts match the run, and the workflow names the real repository
        run: node tools/check-doc-counts.mjs --logs "$RUNNER_TEMP/dsh-qq-doc-counts"

      - name: No name is used without being imported
        run: node tools/check-unbound.mjs .

      - name: No import is left unused
        run: node tools/check-unused-imports.mjs .

      # What `npm publish` would actually upload, checked here rather than discovered by users.
      #
      # dsh-wechat shipped a release with no entry point to load, because `.gitignore` excluded the
      # build output and npm's pack step consults `.gitignore` when a package has no `.npmignore`
      # entry of its own. This package keeps `lib/` out of `.gitignore` for that reason, and this
      # step is what proves the rule still holds — it names files rather than trusting the listing.
      #
      # The list is "what the user is told to read or run", not "everything in the tarball":
      # `docs/HANDBOOK-USER.md` is the file the settings page's help link opens and the one
      # `verify.mjs` treats as the single source that lists every command, `docs/SETTINGS-CONTRACT.md`
      # and `docs/STEP3-*.md` are linked from both READMEs' documentation tables, and all four tools
      # under `tools/` are checks the READMEs tell a developer to run. The rest of `lib/`, and the
      # two research notes no README links, are not enumerated here.
      - name: The tarball carries what users need
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(npm pack --dry-run 2>&1)
          missing=0
          for required in \
            lib/runtime.js lib/router.js index.js client.js cordis.patch.yml \
            README.md README.zh.md LICENSE \
            docs/HANDBOOK-USER.md docs/POSTMORTEM.md docs/RELEASING.md \
            docs/SETTINGS-CONTRACT.md docs/STEP3-能力调研与实现规格.md \
            tools/check-cross-plugin.mjs tools/check-doc-counts.mjs \
            tools/check-unbound.mjs tools/check-unused-imports.mjs
          do
            if ! grep -qF "$required" <<<"$manifest"; then
              echo "missing from the tarball: $required"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "--- npm pack --dry-run said ---"
            echo "$manifest"
            exit 1
          fi
          echo "tarball carries the entry points, the docs and the checkers"
